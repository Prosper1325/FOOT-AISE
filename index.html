<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>FOOT'AISE NANTES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --paper:#EEF2ED;
    --paper-light:#FFFFFF;
    --paper-line: rgba(15,42,26,0.09);
    --ink:#122318;
    --ink-soft:#4C6154;
    --ink-faint:#88998D;
    --green:#1B6B3A;
    --green-soft:#DDEEE2;
    --brass:#2E8B4E;
    --brass-soft:#DCF0E2;
    --gold:#C99A2E;
    --gold-soft:#F5EBD2;
    --rouge:#B23A3A;
    --rouge-soft:#F5E1E1;
    --radius:14px;
    --shadow: 0 1px 2px rgba(15,42,26,0.08), 0 6px 20px rgba(15,42,26,0.08);
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Inter',sans-serif; background: var(--paper); color: var(--ink); -webkit-font-smoothing:antialiased; }
  body::before{
    content:'';
    position:fixed; inset:0; z-index:-1;
    background-image: url('background.png'), linear-gradient(180deg, #0F3D22 0%, #1B6B3A 55%, #0F3D22 100%);
    background-size: contain, cover;
    background-position: center center, center center;
    background-repeat: no-repeat, no-repeat;
    background-attachment: fixed, fixed;
    width: 100vw;
    height: 100vh;
  }
  .app{ width:100%; min-height:100vh; background: rgba(255,255,255,0.5); display:flex; flex-direction:column; position:relative; }

  /* ---------- LOGIN ---------- */
  .login-screen{
    min-height:100vh; display:flex; flex-direction:column; justify-content:center;
    padding: 32px 26px; background: rgba(10,30,18,0.86); color: #F3F7F4;
  }
  .login-screen .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:16px; letter-spacing:0.06em; text-transform:uppercase; color:var(--gold); margin-bottom:8px; font-weight:700; }
  .login-screen h1{ font-family:'Fraunces',serif; font-weight:700; font-size:36px; margin:0 0 6px; line-height:1.1; }
  .login-screen p.sub{ color:#C9D9CE; font-size:14px; margin:0 0 28px; line-height:1.5; }
  .login-screen .field label{ color:#C9D9CE; }
  .login-screen .field input{ background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.2); color:#fff; }
  .login-screen .field select{ background: #FFFFFF; border-color: rgba(255,255,255,0.3); color: var(--ink); }
  .login-screen .field input::placeholder{ color:#8FA695; }
  #s_role_member.active, #s_role_admin.active{ background:var(--rouge) !important; border-color:var(--rouge) !important; color:#fff !important; }
  .login-screen .btn-primary{ background: var(--gold); color: #241a02; }
  .switch-link{ text-align:center; margin-top:16px; font-size:13px; color:#C9D9CE; }
  .switch-link a{ color: var(--gold); cursor:pointer; text-decoration:underline; }
  .login-error{ background: rgba(178,58,58,0.2); color:#F5C6C6; border:1px solid rgba(178,58,58,0.4); padding:9px 12px; border-radius:10px; font-size:12.5px; margin-bottom:14px; display:none; }
  .login-error.show{ display:block; }

  /* ---------- HEADER ---------- */
  header.cover{ padding: 22px 20px 16px; background: var(--ink); color: #F3F7F4; position:relative; border-bottom: 4px double var(--gold); text-align:center; }
  header.cover .logout{ position:absolute; top:20px; right:18px; font-family:'Inter',sans-serif; font-size:12px; text-transform:none; letter-spacing:0; cursor:pointer; color:#C9D9CE; }
  header.cover .header-avatar{ position:absolute; top:16px; left:18px; width:38px; height:38px; border-radius:50%; overflow:hidden; background:var(--gold-soft); display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:600; font-size:14px; color:var(--gold); box-shadow:0 2px 6px rgba(0,0,0,0.25); }
  header.cover .header-avatar img{ width:100%; height:100%; object-fit:cover; }
  header.cover .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:13px; letter-spacing:0.08em; text-transform:uppercase; color: var(--gold); margin-bottom:6px; font-weight:700; }
  header.cover h1{ font-family:'Fraunces',serif; font-weight:700; font-size:28px; margin:0; letter-spacing:-0.01em; }
  header.cover .userline{ font-family:'Fraunces',serif; font-style:italic; font-size:14px; color:#C9D9CE; margin-top:4px; }

  nav.tabs{ display:flex; padding: 0 12px; gap: 2px; border-bottom: 1px solid var(--paper-line); background:var(--paper); overflow-x:auto; -webkit-overflow-scrolling:touch; }
  nav.tabs button{ flex:0 0 auto; white-space:nowrap; background:none; border:none; font-family:'Inter',sans-serif; font-weight:600; font-size:12.5px; color: var(--ink-faint); padding: 10px 12px 12px; cursor:pointer; border-bottom: 3px solid transparent; transition: color .15s; }
  nav.tabs button.active{ color: var(--ink); border-bottom-color: var(--gold); }
  .tab-badge{ display:inline-block; background:var(--rouge); color:#fff; font-size:10px; font-weight:700; border-radius:10px; padding:1px 6px; margin-left:4px; vertical-align:2px; }

  main{ flex:1; padding: 18px 20px 40px; }
  section.view{ display:none; }
  section.view.active{ display:block; }

  h2.section-title{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; margin: 4px 0 12px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .muted{ color: var(--ink-soft); font-size:13px; }
  .back-link{ font-size:13px; color:var(--ink-soft); cursor:pointer; display:inline-flex; align-items:center; gap:4px; margin-bottom:10px; }
  .back-link:hover{ color:var(--ink); }

  .summary{ display:flex; padding: 0 0 4px; gap:10px; flex-wrap:wrap; }
  .summary .card{ flex:1 1 130px; background: var(--paper-light); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); }
  .summary .card .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color: var(--ink-faint); font-family:'IBM Plex Mono',monospace; }
  .summary .card .value{ font-family:'Fraunces',serif; font-weight:600; font-size:16px; margin-top:4px; color: var(--ink); }

  .filter-bar{ display:flex; gap:8px; margin-bottom:14px; overflow-x:auto; padding-bottom:2px; }
  .filter-bar select{ font-family:'Inter',sans-serif; font-size:12.5px; padding:8px 10px; border-radius:10px; border:1.5px solid var(--paper-line); background:var(--paper-light); color:var(--ink-soft); flex-shrink:0; }

  .list-group{ margin-bottom:16px; }
  .list-group-header{ display:flex; justify-content:space-between; align-items:baseline; padding: 0 2px 8px; }
  .list-group-header .lname{ font-family:'Fraunces',serif; font-weight:600; font-size:14.5px; }
  .list-group-header .ltotal{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; color: var(--ink-soft); }

  .ledger{ background: var(--paper-light); border-radius: var(--radius); box-shadow: var(--shadow); overflow:hidden; }
  .ledger-row{ display:flex; align-items:center; gap:12px; padding: 13px 14px; border-bottom: 1px solid var(--paper-line); position:relative; }
  .ledger-row:last-child{ border-bottom:none; }
  .ledger-row .who{ width:38px;height:38px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-family:'Fraunces',serif; font-weight:600; font-size:14px; background: var(--gold-soft); color:var(--gold); flex-shrink:0; overflow:hidden; }
  .ledger-row .who img{ width:100%; height:100%; object-fit:cover; }
  .ledger-row .info{ flex:1; min-width:0; }
  .ledger-row .info .name{ font-weight:600; font-size:14px; }
  .ledger-row .info .meta{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color: var(--ink-faint); margin-top:2px; }
  .ledger-row .amount{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14.5px; white-space:nowrap; }

  .stamp{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; padding: 3px 8px; border-radius: 20px; white-space:nowrap; cursor:pointer; user-select:none; }
  .stamp.paid{ color: var(--green); border: 1.5px solid var(--green); transform: rotate(-4deg); }
  .stamp.pending{ color: var(--gold); border: 1.5px dashed var(--gold); transform: rotate(3deg); }
  .stamp.readonly{ cursor:default; opacity:0.85; }

  .row-actions{ display:flex; align-items:center; gap:8px; }
  .del-btn{ background:none;border:none;color:var(--ink-faint); cursor:pointer; font-size:15px; padding:4px; line-height:1; }
  .del-btn:hover{ color: var(--rouge); }

  .empty{ text-align:center; padding: 40px 20px; color: var(--ink-faint); }
  .empty .glyph{ font-size:26px; margin-bottom:8px; }
  .empty .title{ font-family:'Fraunces',serif; font-size:15px; color:var(--ink-soft); margin-bottom:4px;}

  .fam-tag{ display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:#fff; background:var(--ink); padding:5px 12px; border-radius:20px; margin: 16px 0 8px 2px; }
  .member-card{ background: var(--paper-light); border-radius: var(--radius); box-shadow: var(--shadow); padding: 13px 14px; margin-bottom: 8px; display:flex; align-items:center; gap:12px; }
  .member-card .who{ width:42px;height:42px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-family:'Fraunces',serif; font-weight:600; font-size:15px; background: var(--green-soft); color:var(--green); flex-shrink:0; overflow:hidden; }
  .member-card .who img{ width:100%; height:100%; object-fit:cover; }
  .member-card .info{ flex:1; }
  .member-card .info .name{ font-weight:600; font-size:14.5px; }
  .member-card .info .total{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .member-card .acts{ display:flex; gap:2px; flex-wrap:wrap; justify-content:flex-end; }
  .captain-badge{ display:inline-block; font-size:10px; background:var(--gold-soft); color:var(--gold); padding:2px 7px; border-radius:10px; font-weight:700; margin-left:6px; vertical-align:1px; }

  .overlay{ position:fixed; inset:0; background: rgba(10,30,18,0.5); display:none; align-items:flex-end; justify-content:center; z-index:30; }
  .overlay.active{ display:flex; }
  .sheet{ background: var(--paper-light); width:100%; max-width:520px; border-radius: 20px 20px 0 0; padding: 22px 20px 28px; max-height:88vh; overflow-y:auto; animation: slideup .2s ease-out; }
  @keyframes slideup{ from{ transform:translateY(16px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .sheet h3{ font-family:'Fraunces',serif; font-weight:600; font-size:19px; margin: 0 0 16px; }
  .field{ margin-bottom: 14px; }
  .field label{ display:block; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color: var(--ink-soft); margin-bottom:6px; }
  .field input, .field select, .field textarea{ width:100%; padding: 11px 12px; border-radius: 10px; border: 1.5px solid var(--paper-line); background: var(--paper); font-family:'Inter',sans-serif; font-size:14.5px; color: var(--ink); }
  .field input:focus, .field select:focus, .field textarea:focus{ outline: 2px solid var(--gold); outline-offset:1px; border-color:transparent; }
  .field small.hint{ display:block; margin-top:5px; font-size:11.5px; color:var(--ink-faint); }
  .toggle-group{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .toggle-group button{ flex:1; min-width:90px; padding:10px; border-radius:10px; border:1.5px solid var(--paper-line); background:var(--paper); color:var(--ink-soft); font-weight:600; font-size:13px; cursor:pointer; font-family:'Inter',sans-serif; }
  .toggle-group button.active{ background: var(--ink); color: #fff; border-color:var(--ink); }
  .sheet-actions{ display:flex; gap:10px; margin-top:6px; }
  .sheet-actions button{ flex:1; padding:13px; border-radius:12px; border:none; font-weight:600; font-size:14px; cursor:pointer; font-family:'Inter',sans-serif; }
  .btn-primary{ background: var(--ink); color: #fff; }
  .btn-secondary{ background: var(--paper); color: var(--ink-soft); border:1.5px solid var(--paper-line) !important; }

  .dashed-btn{ width:100%; margin-top:4px; padding:13px; border-radius:12px; border:1.5px dashed var(--gold); background:var(--gold-soft); color:#8A6A1B; font-weight:600; font-size:14px; cursor:pointer; font-family:'Inter',sans-serif; }

  .toast{ position:fixed; top:16px; left:50%; transform:translateX(-50%); background: var(--ink); color:#fff; font-size:13px; padding: 10px 18px; border-radius: 999px; z-index:50; opacity:0; transition: opacity .25s, transform .25s; pointer-events:none; font-family:'Inter',sans-serif; max-width:88%; text-align:center; }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(4px); }

  .loading-screen{ position:fixed; inset:0; background:var(--paper); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; z-index:100; }
  .loading-screen .glyph{ font-family:'Fraunces',serif; font-size:22px; color:var(--ink-soft); }

  .readonly-badge{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color: var(--ink-faint); background: var(--paper-light); border:1px solid var(--paper-line); padding:5px 10px; border-radius:20px; display:inline-block; margin-bottom:12px; }

  .chart-card{ background: var(--paper-light); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 14px; margin-bottom:16px; }
  .chart-card h3{ font-family:'Fraunces',serif; font-weight:600; font-size:14.5px; margin: 0 0 4px; }
  .chart-card .chart-sub{ font-size:11.5px; color:var(--ink-faint); margin-bottom:10px; font-family:'IBM Plex Mono',monospace; }
  .chart-empty{ text-align:center; padding:24px 10px; color:var(--ink-faint); font-size:13px; }

  .event-card{ background: var(--paper-light); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; margin-bottom: 14px; }
  .event-card .event-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
  .event-card .event-name{ font-family:'Fraunces',serif; font-weight:600; font-size:15.5px; }
  .event-card .event-date{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint); margin-top:2px; }
  .score-pill{ display:inline-block; font-family:'Fraunces',serif; font-weight:700; font-size:22px; background:var(--ink); color:#fff; padding:6px 16px; border-radius:12px; margin:6px 0; }
  .result-badge{ display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:10px; margin-left:8px; vertical-align:2px; }
  .result-v{ background:var(--green-soft); color:var(--green); }
  .result-n{ background:var(--gold-soft); color:#8A6A1B; }
  .result-d{ background:var(--rouge-soft); color:var(--rouge); }

  .photo-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(84px,1fr)); gap:6px; margin-bottom:10px; }
  .photo-grid .photo-thumb{ position:relative; aspect-ratio:1/1; border-radius:8px; overflow:hidden; background:var(--paper); }
  .photo-grid .photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; cursor:pointer; }
  .photo-grid .photo-thumb .photo-del{ position:absolute; top:3px; width:auto; height:auto; border-radius:10px; background:rgba(10,30,18,0.7); color:#fff; border:none; font-size:9.5px; font-weight:600; cursor:pointer; line-height:1; padding:4px 7px; }
  .lightbox{ position:fixed; inset:0; background:rgba(6,16,10,0.92); display:none; align-items:center; justify-content:center; z-index:60; padding:20px; }
  .lightbox.active{ display:flex; }
  .lightbox img{ max-width:100%; max-height:90vh; border-radius:8px; }
  .lightbox .lightbox-close{ position:absolute; top:18px; right:18px; color:#fff; font-size:22px; background:none; border:none; cursor:pointer; }

  .suggestion-card{ background: var(--paper-light); border-radius: var(--radius); box-shadow: var(--shadow); padding: 13px 14px; margin-bottom: 8px; }
  .suggestion-card .sug-meta{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-faint); margin-bottom:6px; }
  .suggestion-card .sug-text{ font-size:14px; line-height:1.5; white-space:pre-wrap; }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="loading-screen" id="loadingScreen"><div class="glyph">Ouverture du club…</div></div>

  <!-- LOGIN -->
  <div class="login-screen" id="loginScreen" style="display:none;">
    <div class="eyebrow">Association Sportive</div>
    <h1 id="loginTitle">FOOT'AISE NANTES</h1>
    <p class="sub" id="loginSub">Entrez votre code personnel pour accéder à l'espace du club.</p>
    <div class="login-error" id="loginError"></div>
    <div id="loginFormZone"></div>
  </div>

  <!-- APP SHELL -->
  <div id="appShell" style="display:none;">
    <header class="cover">
      <div class="header-avatar" id="headerAvatar"></div>
      <span class="logout" id="logoutBtn" style="right:18px;top:20px;">Déconnexion</span>
      <span class="logout" id="refreshBtn" style="right:18px;top:40px;">Actualiser</span>
      <div class="eyebrow">Association Sportive</div>
      <h1>FOOT'AISE NANTES</h1>
      <div class="userline" id="userline"></div>
    </header>

    <nav class="tabs">
      <button class="tab-btn active" data-view="cotisations">Cotisations</button>
      <button class="tab-btn" data-view="budget">Budget</button>
      <button class="tab-btn" data-view="depenses">Dépenses</button>
      <button class="tab-btn" data-view="matchs">Matchs</button>
      <button class="tab-btn" data-view="entrainements">Entraînements</button>
      <button class="tab-btn" data-view="membres">Membres</button>
      <button class="tab-btn" data-view="evolution">Évolution</button>
      <button class="tab-btn" data-view="archives">Archives</button>
      <button class="tab-btn" data-view="evenements">Événements à venir</button>
      <button class="tab-btn" data-view="hierarchie">Bureau</button>
      <button class="tab-btn" data-view="reunions">Comptes-Rendus</button>
      <button class="tab-btn" data-view="suggestions">Suggestions</button>
      <button class="tab-btn" data-view="boite" id="boiteTabBtn" style="display:none;">Boîte de réception<span class="tab-badge" id="boiteBadge" style="display:none;"></span></button>
      <button class="tab-btn" data-view="profil">Mon Profil</button>
      <button class="tab-btn" data-view="installer">Installer l'appli</button>
      <button class="tab-btn" data-view="autorisations" id="autorisationsTabBtn" style="display:none;">Autorisations<span class="tab-badge" id="autorisationsBadge" style="display:none;"></span></button>
    </nav>

    <main>
      <section class="view active" id="view-cotisations"><div id="cotisationsInner"></div></section>
      <section class="view" id="view-budget"><div id="budgetInner"></div></section>
      <section class="view" id="view-depenses"><div id="depensesInner"></div></section>
      <section class="view" id="view-matchs"><div id="matchsInner"></div></section>
      <section class="view" id="view-entrainements"><div id="entrainementsInner"></div></section>
      <section class="view" id="view-membres"><h2 class="section-title">Membres</h2><div id="membersList"></div></section>
      <section class="view" id="view-evolution"><div id="evolutionInner"></div></section>
      <section class="view" id="view-archives"><div id="archivesInner"></div></section>
      <section class="view" id="view-evenements"><div id="evenementsInner"></div></section>
      <section class="view" id="view-hierarchie"><div id="hierarchieInner"></div></section>
      <section class="view" id="view-reunions"><div id="reunionsInner"></div></section>
      <section class="view" id="view-suggestions"><div id="suggestionsInner"></div></section>
      <section class="view" id="view-boite"><div id="boiteInner"></div></section>
      <section class="view" id="view-profil"><div id="profilInner"></div></section>
      <section class="view" id="view-installer"><div id="installerInner"></div></section>
      <section class="view" id="view-autorisations"><div id="autorisationsInner"></div></section>
    </main>
  </div>

  <div class="overlay" id="overlay"><div class="sheet" id="sheetContent"></div></div>
  <div class="lightbox" id="lightbox"><button class="lightbox-close" id="lightboxClose">Fermer</button><img id="lightboxImg" src="" alt=""></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ============================================================
   FOOT'AISE NANTES — Espace club
   Stockage : jsonblob.com. Créez un blob vide { } sur
   https://jsonblob.com, protégez-le (compte + Disable Automatic
   Cleanup), puis collez son ID ci-dessous.
   ============================================================ */
const BLOB_ID = '019fdd14-beb8-7c0d-9ad5-6e5a8dbd1dd0';
const API_BASE = 'https://jsonblob.com/api/jsonBlob/';
const MONTHS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
const MONTHS_SHORT = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
const LIST_COLORS = ['#1B6B3A','#C99A2E','#4C6154','#B23A3A','#7C5CBF','#2E8B9E','#C97B3D','#2E7D46','#9E5C8F','#6B7A3D'];
function colorForIndex(i){ return LIST_COLORS[i % LIST_COLORS.length]; }

/* ================= RÔLES =================
   Il n'y a plus de liste figée d'admins : le rôle (membre/admin) est
   stocké sur chaque fiche membre et attribué par un admin existant
   lors de la validation de l'inscription (onglet Autorisations).
   Amorçage : le tout premier profil créé dans un club vide devient
   automatiquement admin, pour éviter la situation où personne ne
   peut valider personne. */

let data = { members: [], lists: [], cotisations: [], depenses: [], depenseLists: [], matchs: [], entrainements: [], archives: [], archiveDocuments: [], suggestions: [], hierarchy: [], meetingNotes: [], upcomingEvents: [], captainIds: [], presidentId: null, superAdminId: null };
let session = { memberId: null };
let ui = { cotisListFilter:'', cotisYearFilter:'', cotisMonthFilter:'', evoYear:'', evoMonth:'', membreOpen:true, budgetYear:'', depYear:'', depListFilter:'', matchYear:'' };

const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));

function euros(n){ return Math.round(n).toLocaleString('fr-FR') + ' €'; }
function initials(str){ return (str||'').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function escapeHTML(str){ const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }
function showToast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }
function normalizeStr(s){ return (s||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase(); }
function csvEscape(v){ const s = String(v==null?'':v); return /[",;\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s; }
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function defaultData(){
  return { members: [], lists: [], cotisations: [], depenses: [], depenseLists: [], matchs: [], entrainements: [], archives: [], archiveDocuments: [], suggestions: [], hierarchy: [], meetingNotes: [], upcomingEvents: [], captainIds: [], presidentId: null, superAdminId: null };
}

/* Super-admin : identifiant technique fixe (assigné au tout premier compte créé),
   toujours admin quoi qu'il arrive, pour ne jamais pouvoir se retrouver bloqué hors
   de son propre club. Repli sur la correspondance de nom si l'identifiant n'est pas
   encore renseigné (ancienne version de l'appli / première ouverture). */
function isSuperAdminByName(m){
  if(!m) return false;
  const full = normalizeStr(m.nom) + ' ' + normalizeStr(m.prenom);
  return full.includes('amouzou') && full.includes('prosper');
}
function isSuperAdmin(m){
  if(!m) return false;
  if(data.superAdminId) return m.id===data.superAdminId;
  return isSuperAdminByName(m);
}
function isPresident(m){ return !!(m && data.presidentId && m.id===data.presidentId); }
function isAdmin(m){ return !!(m && (m.role==='admin' || isSuperAdmin(m))); }
function isCaptain(m){ return !!(m && data.captainIds && data.captainIds.includes(m.id)); }
function canManageMatchs(m){ return isAdmin(m); }
function canManageEntrainements(m){ return isSuperAdmin(m) || isCaptain(m); }
function canProcessAdminRequests(m){ return isSuperAdmin(m); }
function canProcessMemberRequests(m){ return isSuperAdmin(m) || isPresident(m); }

function currentMember(){ return data.members.find(m=>m.id===session.memberId); }
function adminMembers(){ return data.members.filter(m=>isAdmin(m)); }

function passwordFieldHTML(id, value, placeholder){
  return `<div style="position:relative;">
    <input type="password" id="${id}" value="${escapeHTML(value||'')}" placeholder="${placeholder||''}" style="padding-right:44px;">
    <button type="button" data-toggle-pass="${id}" title="Afficher/masquer" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:17px;color:var(--ink-faint);padding:6px;line-height:1;">👁</button>
  </div>`;
}
function wirePasswordToggles(){
  document.querySelectorAll('[data-toggle-pass]').forEach(b=>{
    b.onclick = () => {
      const inp = $('#'+b.dataset.togglePass);
      if(!inp) return;
      if(inp.type==='password'){ inp.type='text'; b.textContent='🙈'; }
      else { inp.type='password'; b.textContent='👁'; }
    };
  });
}

function compressImage(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
        else if(h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ================= DATA I/O ================= */
async function refreshData(){
  if(!BLOB_ID || BLOB_ID === 'REPLACE_WITH_BLOB_ID') return;
  try{
    const res = await fetch(API_BASE + BLOB_ID, { headers: {'Accept':'application/json'} });
    if(!res.ok) return;
    const loaded = await res.json();
    data = Object.assign(defaultData(), loaded);
  }catch(e){ console.error('refresh failed', e); }
}

async function loadData(){
  if(!BLOB_ID || BLOB_ID === 'REPLACE_WITH_BLOB_ID'){
    showSetupError('Le club n’a pas encore été configuré. L’administrateur doit renseigner le BLOB_ID.');
    return;
  }
  try{
    const res = await fetch(API_BASE + BLOB_ID, { headers: {'Accept':'application/json'} });
    if(!res.ok) throw new Error('introuvable ('+res.status+')');
    const loaded = await res.json();
    data = Object.assign(defaultData(), loaded);
  }catch(e){
    console.error(e);
    showSetupError('Impossible de contacter le serveur. Vérifiez votre connexion internet et réessayez.');
    return;
  }
  migrate();
  $('#loadingScreen').style.display='none';
  showLogin();
}

function showSetupError(msg){
  $('#loadingScreen').innerHTML = `<div class="glyph" style="text-align:center;padding:0 24px;">${escapeHTML(msg)}</div><button id="retryBtn" style="margin-top:14px;padding:10px 18px;border-radius:20px;border:none;background:var(--ink);color:#fff;font-family:'Inter',sans-serif;font-weight:600;cursor:pointer;">Réessayer</button>`;
  $('#retryBtn').onclick = () => { $('#loadingScreen').innerHTML = '<div class="glyph">Ouverture du club…</div>'; loadData(); };
}

function migrate(){
  let changed = false;
  data.suggestions.forEach(s=>{ if(s.lu===undefined){ s.lu = true; changed = true; } });
  data.members.forEach(m=>{ if(!m.status){ m.status='active'; changed=true; } if(!m.role){ m.role='member'; changed=true; } });
  data.lists.forEach(l=>{ if(!l.type){ l.type='autre'; changed=true; } });
  if(!data.superAdminId){
    const candidate = data.members.find(m=>isSuperAdminByName(m) && m.role==='admin') || data.members.find(m=>isSuperAdminByName(m));
    if(candidate){ data.superAdminId = candidate.id; changed = true; }
  }
  if(changed) saveData();
}

async function saveData(){
  try{
    const res = await fetch(API_BASE + BLOB_ID, {
      method: 'PUT',
      headers: { 'Content-Type':'application/json', 'Accept':'application/json' },
      body: JSON.stringify(data)
    });
    if(!res.ok) throw new Error('échec de l’enregistrement ('+res.status+')');
  }catch(e){
    console.error(e);
    showToast("Erreur d'enregistrement, vérifiez votre connexion et réessayez.");
  }
}

function doSignup(firstEver, desiredRole){
  const prenom = $('#s_prenom').value.trim();
  const nom = $('#s_nom').value.trim();
  const poste = $('#s_poste').value;
  const code = $('#s_code').value.trim();
  if(!prenom || !nom){ loginError('Indiquez votre nom et prénom.'); return; }
  if(!code){ loginError('Choisissez un code personnel.'); return; }
  if(data.members.some(m=>m.code===code)){ loginError('Ce code est déjà utilisé, choisissez-en un autre.'); return; }
  if(firstEver){
    const bootstrapMember = { id: uid(), prenom, nom, code, poste, status: 'active', role: 'admin' };
    data.members.push(bootstrapMember);
    data.superAdminId = bootstrapMember.id;
    saveData();
    renderLoginForm();
    loginError('Compte admin créé ! Vous pouvez vous connecter dès maintenant.');
    $('#loginError').style.background='rgba(27,107,58,0.18)'; $('#loginError').style.color='#BFE3CB'; $('#loginError').style.borderColor='rgba(27,107,58,0.4)';
    return;
  }
  const member = { id: uid(), prenom, nom, code, poste, status: 'pending', role: 'member', desiredRole: desiredRole||'member' };
  data.members.push(member);
  const notifyTargets = desiredRole==='admin'
    ? data.members.filter(m=>isSuperAdmin(m))
    : data.members.filter(m=>isSuperAdmin(m) || isPresident(m));
  notifyTargets.forEach(a=>{
    data.suggestions.push({
      id: uid(), senderId: member.id, senderName: `${member.prenom} ${member.nom}`,
      recipientId: a.id, recipientName: `${a.prenom} ${a.nom}`,
      text: `${member.prenom} ${member.nom} demande à rejoindre le club (rôle souhaité : ${desiredRole==='admin'?'Admin':'Membre'}). Rendez-vous dans l'onglet "Autorisations" pour traiter la demande.`,
      date: new Date().toISOString(), lu: false
    });
  });
  saveData();
  renderLoginForm();
  loginError('Votre demande a été envoyée au bureau. Vous pourrez vous connecter une fois validée.');
  $('#loginError').style.background='rgba(27,107,58,0.18)'; $('#loginError').style.color='#BFE3CB'; $('#loginError').style.borderColor='rgba(27,107,58,0.4)';
}

function nearestSunday(){
  const d = new Date();
  const day = d.getDay(); // 0 = dimanche
  const diff = day===0 ? 0 : -day; // recule jusqu'au dimanche précédent (ou aujourd'hui si déjà dimanche)
  d.setDate(d.getDate() + diff);
  return d.toISOString().slice(0,10);
}

function passesCotisFilter(c){
  if(ui.cotisYearFilter && c.date.slice(0,4)!==ui.cotisYearFilter) return false;
  if(ui.cotisMonthFilter && String(parseInt(c.date.slice(5,7),10))!==String(ui.cotisMonthFilter)) return false;
  return true;
}

function renderListsZone(canWrite){
  const zone = $('#listsZone');
  const listsInSubTab = data.lists.filter(l=>(l.type||'autre')===ui.cotisSubTab);
  if(ui.cotisListFilter==='__none__'){
    zone.innerHTML = emptyState('','Aucune liste affichée','Changez le filtre "Liste" pour en voir une.');
    return;
  }
  let listsToShow = ui.cotisListFilter ? listsInSubTab.filter(l=>l.id===ui.cotisListFilter) : listsInSubTab;
  if(listsInSubTab.length===0){
    zone.innerHTML = emptyState('','Aucune liste pour l’instant', canWrite ? 'Créez-en une avec le bouton ci-dessous.' : 'Aucune cotisation n’a encore été saisie ici.');
    return;
  }
  let html=''; let anyRow=false;
  listsToShow.sort((a,b)=>a.name.localeCompare(b.name,'fr')).forEach(list=>{
    const rows = data.cotisations.filter(c=>c.listId===list.id && passesCotisFilter(c)).sort((a,b)=>b.date.localeCompare(a.date));
    if(rows.length===0) return;
    anyRow=true;
    const subtotal = rows.filter(c=>c.status==='paid').reduce((s,c)=>s+c.amount,0);
    html += `
      <div class="list-group">
        <div class="list-group-header">
          <span class="lname">${escapeHTML(list.name)}</span>
          <span style="display:flex;align-items:center;gap:8px;">
            <span class="ltotal">${euros(subtotal)}</span>

function exportAllCotisCSV(){

/* ---- Import fichier ---- */
const HEADER_ALIASES = {
  prenom: ['prenom','prénom','first name','firstname'], nom: ['nom','last name','lastname','surname'],
  fullname: ['nom complet','membre','name'], montant: ['montant','amount','somme','montant (eur)','montant (€)'],
  date: ['date'], statut: ['statut','status','etat','état'], motif: ['motif','note','commentaire']
};
function detectColumns(headerRow){
  const map={}; headerRow.forEach(h=>{ const n=normalizeStr(h); for(const k in HEADER_ALIASES){ if(HEADER_ALIASES[k].some(a=>normalizeStr(a)===n)) map[k]=h; } }); return map;
}
function parseImportRows(rows){
  const matched=[], unmatched=[]; if(rows.length===0) return {matched,unmatched};
  const colMap = detectColumns(Object.keys(rows[0])); const today=new Date().toISOString().slice(0,10);
  rows.forEach((row,idx)=>{
    let prenom = colMap.prenom?String(row[colMap.prenom]||'').trim():'';
    let nom = colMap.nom?String(row[colMap.nom]||'').trim():'';
    if((!prenom||!nom) && colMap.fullname){ const full=String(row[colMap.fullname]||'').trim(); if(full){ const p=full.split(/\s+/); if(p.length>=2){ prenom=p[0]; nom=p.slice(1).join(' '); } } }
    if(!prenom && !nom) return;
    const member = data.members.find(m=>normalizeStr(m.prenom)===normalizeStr(prenom)&&normalizeStr(m.nom)===normalizeStr(nom));
    const amt = parseFloat(String(colMap.montant?row[colMap.montant]:'').replace(/[^\d,.\-]/g,'').replace(',','.'));
    if(!member){ unmatched.push({reason:`${prenom} ${nom} (ligne ${idx+2}) : membre introuvable`}); return; }
    if(!amt || amt<=0){ unmatched.push({reason:`${prenom} ${nom} (ligne ${idx+2}) : montant invalide`}); return; }
    let date=today; const dv=colMap.date?String(row[colMap.date]||'').trim():''; if(dv){ const d=new Date(dv); if(!isNaN(d.getTime())) date=d.toISOString().slice(0,10); }
    let status='paid'; const sv=colMap.statut?normalizeStr(String(row[colMap.statut]||'')):''; if(sv && ['attente','pending','non','impaye'].some(k=>sv.includes(k))) status='pending';
    matched.push({ memberId:member.id, memberName:`${member.prenom} ${member.nom}`, amount:amt, date, status, label: colMap.motif?String(row[colMap.motif]||'').trim():'' });
  });
  return {matched,unmatched};
}
function openImportSheet(){
  let mode = data.lists.length>0?'existing':'new';
  function step1(){
    $('#sheetContent').innerHTML = `
      <h3>Importer un fichier</h3>

      <div class="field"><label>Liste de destination</label>
        <div class="toggle-group"><button type="button" id="im_e" class="${mode==='existing'?'active':''}" ${data.lists.length===0?'disabled':''}>Liste existante</button><button type="button" id="im_n" class="${mode==='new'?'active':''}">Nouvelle liste</button></div>

    function field(){ $('#im_zone').innerHTML = mode==='existing' ? `<select id="im_list">${data.lists.map(l=>`<option value="${l.id}">${escapeHTML(l.name)}</option>`).join('')}</select>` : `<input type="text" id="im_newlist" placeholder="ex : Cotisation Février 2026" autocorrect="on" autocapitalize="sentences" spellcheck="true">`; }

    $('#im_n').onclick=()=>{ mode='new'; $('#im_n').classList.add('active'); $('#im_e').classList.remove('active'); field(); };

      const fi=$('#importFile'); if(!fi.files||fi.files.length===0){ showToast('Choisissez un fichier.'); return; }

      if(mode==='new'){ listName=$('#im_newlist').value.trim(); if(!listName){ showToast('Nommez la nouvelle liste.'); return; } } else { listId=$('#im_list').value; }
      const file=fi.files[0]; const isCSV=/\.csv$/i.test(file.name); const reader=new FileReader();
      reader.onload=(e)=>{ try{ const wb=isCSV?XLSX.read(e.target.result,{type:'string'}):XLSX.read(e.target.result,{type:'array',cellDates:true}); const ws=wb.Sheets[wb.SheetNames[0]]; const rows=XLSX.utils.sheet_to_json(ws,{defval:'',raw:false,dateNF:'yyyy-mm-dd'}); preview(parseImportRows(rows), mode, listName, listId); }catch(err){ console.error(err); showToast('Impossible de lire ce fichier.'); } };
      if(isCSV) reader.readAsText(file); else reader.readAsArrayBuffer(file);
    };
  }
  function preview(result, mode, listName, listId){
    const {matched,unmatched}=result; const total=matched.reduce((s,r)=>s+r.amount,0);
    $('#sheetContent').innerHTML = `
      <h3>Aperçu de l’import</h3>
      <p class="muted" style="margin-bottom:10px;">${matched.length} ligne(s) reconnue(s) — ${euros(total)}.${unmatched.length>0?` ${unmatched.length} ignorée(s).`:''}</p>
      <div class="ledger" style="margin-bottom:12px;max-height:240px;overflow-y:auto;">${matched.slice(0,50).map(r=>`<div class="ledger-row"><div class="who">${initials(r.memberName)}</div><div class="info"><div class="name">${escapeHTML(r.memberName)}</div><div class="meta">${escapeHTML(r.date)}</div></div><div class="row-actions"><span class="stamp ${r.status==='paid'?'paid':'pending'} readonly">${r.status==='paid'?'Payé':'En attente'}</span><span class="amount">${euros(r.amount)}</span></div></div>`).join('')}</div>
      ${unmatched.length>0?`<p class="muted" style="color:var(--rouge);">Ignorés : ${unmatched.slice(0,8).map(u=>escapeHTML(u.reason)).join(' · ')}</p>`:''}
      <div class="sheet-actions"><button class="btn-secondary" id="backBtn">Retour</button><button class="btn-primary" id="confirmImportBtn" ${matched.length===0?'disabled':''}>Importer ${matched.length}</button></div>`;
    $('#backBtn').onclick=step1;
    if(matched.length>0){ $('#confirmImportBtn').onclick=()=>{
      let finalListId=listId;
      if(mode==='new'){ const list={id:uid(),name:listName,createdAt:new Date().toISOString().slice(0,10)}; data.lists.push(list); finalListId=list.id; }
      matched.forEach(r=>data.cotisations.push({id:uid(),listId:finalListId,memberId:r.memberId,amount:r.amount,date:r.date,label:r.label,status:r.status}));
      saveData(); render(); closeSheet(); showToast(`${matched.length} cotisation(s) importée(s).`);
    }; }
  }
  step1(); openSheet();
}

  $('#cancelSheet').onclick=closeSheet;

    else { listId=gridSelectedListId||($('#g_list')?$('#g_list').value:''); if(!listId){ showToast('Choisissez une liste.'); return; } }
    const date=gridDate||today; let count=0;
    data.members.forEach(m=>{ const val=parseFloat($('#grid_amount_'+m.id).value); if(val&&val>0){ data.cotisations.push({id:uid(),listId,memberId:m.id,amount:val,date,label:'',status:gridRowStatus[m.id]}); count++; } });
    let newMembersCreated=0;
    gridNewRows.forEach(r=>{
      const val=parseFloat(r.amount); if(!val||val<=0) return;
      const nom=(r.nom||'').trim(), prenom=(r.prenom||'').trim(); if(!nom&&!prenom) return;
      let member=data.members.find(m=>normalizeStr(m.nom)===normalizeStr(nom)&&normalizeStr(m.prenom)===normalizeStr(prenom));
      if(!member){ let code; do{ code=String(Math.floor(1000+Math.random()*9000)); }while(data.members.some(m=>m.code===code)); member={id:uid(),prenom:prenom||'(?)',nom:nom||'(?)',code,status:'active'}; data.members.push(member); newMembersCreated++; }
      data.cotisations.push({id:uid(),listId,memberId:member.id,amount:val,date,label:'',status:r.status}); count++;
    });
    if(count===0){ showToast('Renseignez au moins un montant.'); return; }
    saveData(); render(); closeSheet();
    showToast(`${count} cotisation(s) enregistrée(s)${newMembersCreated>0?`, ${newMembersCreated} nouveau(x) membre(s) créé(s) avec un code temporaire (à modifier dans Mon Profil)`:''}.`);
  };
}

function renderBudgetContent(){
  const passesMonth = (dateStr) => !ui.budgetMonth || String(parseInt(dateStr.slice(5,7),10))===String(ui.budgetMonth);
  const recettes = data.cotisations.filter(c=>c.status==='paid' && c.date.slice(0,4)===ui.budgetYear && passesMonth(c.date));
  const depenses = data.depenses.filter(d=>d.date.slice(0,4)===ui.budgetYear && passesMonth(d.date));
  const totalRecettes = recettes.reduce((s,c)=>s+c.amount,0);
  const totalDepenses = depenses.reduce((s,d)=>s+d.amount,0);
  const solde = totalRecettes - totalDepenses;
  $('#budgetKpis').innerHTML = `<div class="summary">
    <div class="card"><div class="label">Recettes (cotisations)</div><div class="value" style="color:var(--green);">${euros(totalRecettes)}</div></div>
    <div class="card"><div class="label">Dépenses</div><div class="value" style="color:var(--rouge);">${euros(totalDepenses)}</div></div>
    <div class="card"><div class="label">Solde</div><div class="value" style="color:${solde>=0?'var(--green)':'var(--rouge)'};">${solde>=0?'+':''}${euros(solde)}</div></div>
  </div>`;
  const monthlyIn = new Array(12).fill(0), monthlyOut = new Array(12).fill(0);
  data.cotisations.filter(c=>c.status==='paid' && c.date.slice(0,4)===ui.budgetYear).forEach(c=>{ monthlyIn[parseInt(c.date.slice(5,7),10)-1] += c.amount; });
  data.depenses.filter(d=>d.date.slice(0,4)===ui.budgetYear).forEach(d=>{ monthlyOut[parseInt(d.date.slice(5,7),10)-1] += d.amount; });
  const series = [ {name:'Recettes', color:'#1B6B3A', values:monthlyIn}, {name:'Dépenses', color:'#B23A3A', values:monthlyOut} ];
  $('#budgetChart').innerHTML = `<div class="chart-card"><h3>Recettes vs Dépenses</h3><div class="chart-sub">Par mois — ${ui.budgetYear}</div>${svgGroupedBarChart(MONTHS_SHORT, series)}
    <div style="display:flex;gap:14px;margin-top:10px;">${series.map(s=>`<span style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-soft);"><span style="width:10px;height:10px;border-radius:3px;background:${s.color};display:inline-block;"></span>${s.name}</span>`).join('')}</div>
  </div>`;
}
function svgGroupedBarChart(labels, series){
  const w=480, h=230, padL=32, padR=10, padT=14, padB=28;
  const innerW=w-padL-padR, innerH=h-padT-padB;
  const maxVal=Math.max(1, ...series.flatMap(s=>s.values));
  const gap=innerW/labels.length; const groupW=Math.min(34, gap*0.7); const barW=groupW/series.length;
  let svg='';
  for(let g=0; g<=4; g++){ const gy=padT+innerH-(g/4)*innerH; svg+=`<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${w-padR}" y2="${gy.toFixed(1)}" style="stroke:var(--paper-line);stroke-width:1;"></line><text x="${padL-4}" y="${(gy+3).toFixed(1)}" font-size="8" text-anchor="end" style="fill:var(--ink-faint);font-family:'IBM Plex Mono',monospace;">${Math.round(maxVal*g/4)}</text>`; }
  labels.forEach((lab,i)=>{
    const gx = padL + i*gap + (gap-groupW)/2;
    series.forEach((s,si)=>{ const v=s.values[i]||0; const bh=(v/maxVal)*innerH; const x=gx+si*barW; const y=padT+innerH-bh; svg+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(barW-2).toFixed(1)}" height="${Math.max(bh,0.5).toFixed(1)}" style="fill:${s.color};" rx="2"></rect>`; });
    svg += `<text x="${(gx+groupW/2).toFixed(1)}" y="${h-padB+13}" font-size="8" text-anchor="middle" style="fill:var(--ink-faint);font-family:'IBM Plex Mono',monospace;">${lab}</text>`;
  });
  svg += `<line x1="${padL}" y1="${padT+innerH}" x2="${w-padR}" y2="${padT+innerH}" style="stroke:var(--paper-line);stroke-width:1;"></line>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">${svg}</svg>`;
}

function passesDepFilter(d){
  if(ui.depYear && d.date.slice(0,4)!==ui.depYear) return false;
  return true;
}

function renderDepListsZone(canWrite){
  const zone = $('#depListsZone');
  let listsToShow = ui.depListFilter ? data.depenseLists.filter(l=>l.id===ui.depListFilter) : data.depenseLists;
  if(data.depenseLists.length===0){
    zone.innerHTML = emptyState('','Aucune liste de dépenses pour l’instant', canWrite ? 'Créez-en une avec le bouton ci-dessous.' : 'Aucune dépense n’a encore été saisie.');
    return;
  }
  let html=''; let anyRow=false;
  listsToShow.sort((a,b)=>a.name.localeCompare(b.name,'fr')).forEach(list=>{
    const rows = data.depenses.filter(d=>d.listId===list.id && passesDepFilter(d)).sort((a,b)=>b.date.localeCompare(a.date));
    if(rows.length===0) return;
    anyRow=true;
    const subtotal = rows.reduce((s,d)=>s+d.amount,0);

  zone.querySelectorAll('[data-edit-dep]').forEach(b=>{ b.onclick=()=>openDepenseSheet(b.dataset.editDep); });
  zone.querySelectorAll('[data-del-dep]').forEach(b=>{ b.onclick=()=>{ if(confirm('Supprimer cette dépense ?')){ data.depenses=data.depenses.filter(d=>d.id!==b.dataset.delDep); saveData(); render(); } }; });

  });
}

function exportAllDepensesCSV(){
  const lines=[['Liste','Titre','Catégorie','Montant (€)','Date','Note'].map(csvEscape).join(';')];
  data.depenses.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(d=>{
    const list = data.depenseLists.find(l=>l.id===d.listId);
    lines.push([list?list.name:'', d.title, d.category, d.amount, d.date, d.note||''].map(csvEscape).join(';'));
  });
  downloadBlob(new Blob(['\uFEFF'+lines.join('\n')],{type:'text/csv;charset=utf-8;'}), `footaise-depenses.csv`);
}

  zone.querySelectorAll('[data-dep-date]').forEach(i=>{ i.oninput=()=>{ const r=depGridRows.find(x=>x.tempId===i.dataset.depDate); if(r) r.date=i.value; }; });
  zone.querySelectorAll('[data-dep-amount]').forEach(i=>{ i.oninput=()=>{ const r=depGridRows.find(x=>x.tempId===i.dataset.depAmount); if(r) r.amount=i.value; }; });

/* ================= MATCHS ================= */
function renderMatchs(){
  const el = $('#matchsInner');
  const me = currentMember(); const canWrite = canManageMatchs(me);
  const years = Array.from(new Set(data.matchs.map(mt=>mt.date.slice(0,4)))).sort().reverse();
  const currentYear = String(new Date().getFullYear());
  if(!years.includes(currentYear)) years.unshift(currentYear);
  if(!ui.matchYear || !years.includes(ui.matchYear)) ui.matchYear = years[0];

  const seasonMatches = data.matchs.filter(mt=>mt.date.slice(0,4)===ui.matchYear).sort((a,b)=>b.date.localeCompare(a.date));
  let v=0,n=0,d=0, bp=0, bc=0;
  const scorers = {};
  seasonMatches.forEach(mt=>{
    if(mt.scoreNous>mt.scoreAdv) v++; else if(mt.scoreNous===mt.scoreAdv) n++; else d++;
    bp += mt.scoreNous||0; bc += mt.scoreAdv||0;
    (mt.buteurs||[]).forEach(b=>{ scorers[b.memberId] = (scorers[b.memberId]||0) + (b.buts||1); });
  });
  let topScorer=null, topGoals=0;
  Object.entries(scorers).forEach(([mid,g])=>{ if(g>topGoals){ topGoals=g; topScorer=mid; } });
  const topScorerObj = topScorer ? data.members.find(m=>m.id===topScorer) : null;

  el.innerHTML = `
    <h2 class="section-title">Matchs</h2>
    <div class="filter-bar"><select id="matchYearSelect">${years.map(y=>`<option value="${y}" ${ui.matchYear===y?'selected':''}>${y}</option>`).join('')}</select></div>
    <div class="summary" style="margin-bottom:14px;">
      <div class="card"><div class="label">Bilan</div><div class="value"><span style="color:var(--green);">${v}V</span> · <span style="color:var(--gold);">${n}N</span> · <span style="color:var(--rouge);">${d}D</span></div></div>
      <div class="card"><div class="label">Buts marqués / encaissés</div><div class="value">${bp} / ${bc}</div></div>
      <div class="card"><div class="label">Meilleur buteur</div><div class="value" style="font-size:14px;">${topScorerObj?`${topScorerObj.prenom} ${topScorerObj.nom} (${topGoals})`:'—'}</div></div>
    </div>
    <div id="matchList"></div>
  `;
  $('#matchYearSelect').onchange = e => { ui.matchYear = e.target.value; render(); };
  const zone = $('#matchList');
  if(seasonMatches.length===0){ zone.innerHTML = emptyState('','Aucun match enregistré pour cette saison', canWrite?'Ajoutez le premier avec le bouton ci-dessous.':''); }
  else {
    zone.innerHTML = seasonMatches.map(mt=>{
      const dateFmt = new Date(mt.date).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'});
      const result = mt.scoreNous>mt.scoreAdv?'v':(mt.scoreNous===mt.scoreAdv?'n':'d');
      const resultLabel = result==='v'?'Victoire':(result==='n'?'Nul':'Défaite');
      const motm = mt.hommeDuMatch ? data.members.find(m=>m.id===mt.hommeDuMatch) : null;
      const buteursNames = (mt.buteurs||[]).map(b=>{ const m=data.members.find(x=>x.id===b.memberId); return m?`${m.prenom} ${m.nom}${b.buts>1?` (${b.buts})`:''}`:''; }).filter(Boolean).join(', ');
      return `<div class="event-card">
        <div class="event-head">
          <div><div class="event-name">FOOT'AISE NANTES vs ${escapeHTML(mt.adversaire)}<span class="result-badge result-${result}">${resultLabel}</span></div><div class="event-date">${dateFmt}${mt.lieu?' · '+escapeHTML(mt.lieu):''}${mt.competition?' · '+escapeHTML(mt.competition):''}</div></div>
          ${canWrite?`<button class="del-btn" data-del-match="${mt.id}" title="Supprimer">Supprimer</button>`:''}
        </div>
        <div class="score-pill">${mt.scoreNous} - ${mt.scoreAdv}</div>
        ${buteursNames?`<div style="font-size:13px;color:var(--ink-soft);margin-top:6px;">Buteurs : ${escapeHTML(buteursNames)}</div>`:''}
        ${motm?`<div style="font-size:13px;color:var(--ink-soft);margin-top:4px;">Homme du match : ${escapeHTML(motm.prenom+' '+motm.nom)}</div>`:''}
        ${mt.notes?`<div style="font-size:13px;color:var(--ink-soft);margin-top:4px;">${escapeHTML(mt.notes)}</div>`:''}
        ${canWrite?`<button class="del-btn" data-edit-match="${mt.id}" style="margin-top:8px;">Modifier</button>`:''}
      </div>`;
    }).join('');
  }
  zone.querySelectorAll('[data-del-match]').forEach(b=>{ b.onclick=()=>{ if(confirm('Supprimer ce match ?')){ data.matchs=data.matchs.filter(m=>m.id!==b.dataset.delMatch); saveData(); render(); } }; });
  zone.querySelectorAll('[data-edit-match]').forEach(b=>{ b.onclick=()=>openMatchSheet(b.dataset.editMatch); });
  if(canWrite){ const btn=document.createElement('button'); btn.className='dashed-btn'; btn.style.marginTop='4px'; btn.textContent='＋ Ajouter un match'; btn.onclick=()=>openMatchSheet(null); el.appendChild(btn); }
}
function openMatchSheet(matchId){
  const me = currentMember();
  if(!canManageMatchs(me)){ showToast('Réservé au bureau.'); return; }
  const existing = matchId ? data.matchs.find(m=>m.id===matchId) : null;
  const today = new Date().toISOString().slice(0,10);
  let composition = existing ? (existing.composition||[]).slice() : [];
  let buteurs = existing ? (existing.buteurs||[]).map(b=>({...b, tempId:uid()})) : [];

  function renderSheetBody(){
    $('#sheetContent').innerHTML = `
      <h3>${existing?'Modifier le':'Nouveau'} match</h3>
      <div class="field"><label>Adversaire</label><input type="text" id="m_adv" value="${existing?escapeHTML(existing.adversaire):''}" placeholder="ex : AS Rezé" autocorrect="on" autocapitalize="sentences" spellcheck="true"></div>
      <div class="field"><label>Date</label><input type="date" id="m_date" value="${existing?existing.date:today}"></div>
      <div class="field"><label>Lieu</label><input type="text" id="m_lieu" value="${existing?escapeHTML(existing.lieu||''):''}" placeholder="ex : Stade de la Beaujoire (Domicile)" autocorrect="on" autocapitalize="sentences" spellcheck="true"></div>
      <div class="field"><label>Compétition (optionnel)</label><input type="text" id="m_comp" value="${existing?escapeHTML(existing.competition||''):''}" placeholder="ex : Coupe de Loire-Atlantique" autocorrect="on" autocapitalize="sentences" spellcheck="true"></div>
      <div class="field" style="display:flex;gap:10px;">
        <div style="flex:1;"><label>Score — nous</label><input type="number" id="m_score_us" min="0" value="${existing?existing.scoreNous:0}"></div>
        <div style="flex:1;"><label>Score — adversaire</label><input type="number" id="m_score_them" min="0" value="${existing?existing.scoreAdv:0}"></div>
      </div>
      <div class="field"><label>Composition (joueurs alignés)</label><div id="compZone" style="max-height:160px;overflow-y:auto;border:1.5px solid var(--paper-line);border-radius:10px;padding:8px 10px;">${familyLikeMemberCheckboxes(composition)}</div></div>
      <div class="field"><label>Buteurs</label><div id="scorersZone"></div><button type="button" class="dashed-btn" id="addScorerBtn" style="margin-top:4px;">＋ Ajouter un buteur</button></div>
      <div class="field"><label>Homme du match</label><select id="m_motm"><option value="">— Non désigné —</option>${data.members.map(m=>`<option value="${m.id}" ${existing&&existing.hommeDuMatch===m.id?'selected':''}>${escapeHTML(m.prenom+' '+m.nom)}</option>`).join('')}</select></div>
      <div class="field"><label>Notes (optionnel)</label><textarea id="m_notes" rows="3" style="width:100%;padding:11px 12px;border-radius:10px;border:1.5px solid var(--paper-line);background:var(--paper);resize:vertical;" autocorrect="on" autocapitalize="sentences" spellcheck="true">${existing?escapeHTML(existing.notes||''):''}</textarea></div>
      <div class="sheet-actions"><button class="btn-secondary" id="cancelSheet">Annuler</button><button class="btn-primary" id="saveSheet">Enregistrer</button></div>
    `;
    document.querySelectorAll('#compZone [data-comp-member]').forEach(cb=>{
      cb.onchange = () => { const id=cb.dataset.compMember; if(cb.checked){ if(!composition.includes(id)) composition.push(id); } else { composition = composition.filter(x=>x!==id); } };
    });
    renderScorersZone();
    $('#addScorerBtn').onclick = () => { buteurs.push({tempId:uid(), memberId: data.members[0]?data.members[0].id:'', buts:1}); renderScorersZone(); };
    $('#cancelSheet').onclick = closeSheet;
    $('#saveSheet').onclick = () => {
      const adversaire = $('#m_adv').value.trim();
      if(!adversaire){ showToast('Indiquez l’adversaire.'); return; }
      const payload = {
        adversaire, date: $('#m_date').value||today, lieu: $('#m_lieu').value.trim(), competition: $('#m_comp').value.trim(),
        scoreNous: parseInt($('#m_score_us').value,10)||0, scoreAdv: parseInt($('#m_score_them').value,10)||0,
        composition: composition.slice(), buteurs: buteurs.filter(b=>b.memberId).map(b=>({memberId:b.memberId, buts: parseInt(b.buts,10)||1})),
        hommeDuMatch: $('#m_motm').value || null, notes: $('#m_notes').value.trim()
      };
      if(existing) Object.assign(existing, payload); else data.matchs.push({id:uid(), ...payload});
      saveData(); render(); closeSheet(); showToast('Match enregistré.');
    };
  }
  function renderScorersZone(){
    const zone = $('#scorersZone');
    zone.innerHTML = buteurs.map(b=>`
      <div style="display:flex;gap:6px;margin-bottom:6px;align-items:center;">
        <select data-scorer-member="${b.tempId}" style="flex:1;padding:9px;border-radius:8px;border:1.5px solid var(--paper-line);">${data.members.map(m=>`<option value="${m.id}" ${b.memberId===m.id?'selected':''}>${escapeHTML(m.prenom+' '+m.nom)}</option>`).join('')}</select>
        <input type="number" data-scorer-buts="${b.tempId}" value="${b.buts}" min="1" style="width:60px;padding:9px;border-radius:8px;border:1.5px solid var(--paper-line);">
        <button type="button" data-scorer-del="${b.tempId}" class="del-btn">Retirer</button>
      </div>`).join('');
    zone.querySelectorAll('[data-scorer-member]').forEach(s=>{ s.onchange=()=>{ const b=buteurs.find(x=>x.tempId===s.dataset.scorerMember); if(b) b.memberId=s.value; }; });
    zone.querySelectorAll('[data-scorer-buts]').forEach(i=>{ i.oninput=()=>{ const b=buteurs.find(x=>x.tempId===i.dataset.scorerButs); if(b) b.buts=i.value; }; });
    zone.querySelectorAll('[data-scorer-del]').forEach(b2=>{ b2.onclick=()=>{ buteurs = buteurs.filter(x=>x.tempId!==b2.dataset.scorerDel); renderScorersZone(); }; });
  }
  renderSheetBody();
  openSheet();
}
function familyLikeMemberCheckboxes(selected){

/* ================= ÉVOLUTION ================= */
function renderEvolution(){
  const el = $('#evolutionInner');
  const years = Array.from(new Set(data.cotisations.map(c=>c.date.slice(0,4)))).sort().reverse();
  const currentYear = String(new Date().getFullYear());
  if(!years.includes(currentYear)) years.unshift(currentYear);
  if(!ui.evoYear || !years.includes(ui.evoYear)) ui.evoYear = years[0];
  if(!ui.evoMonth) ui.evoMonth = '';

  el.innerHTML = `
    <h2 class="section-title">Évolution des cotisations</h2>
    <div class="filter-bar">
      <select id="evoYearSelect">${years.map(y=>`<option value="${y}" ${ui.evoYear===y?'selected':''}>${y}</option>`).join('')}</select>
      <select id="evoMonthSelect"><option value="">Tous les mois</option>${MONTHS.map((m,i)=>`<option value="${i+1}" ${String(ui.evoMonth)===String(i+1)?'selected':''}>${m}</option>`).join('')}</select>
    </div>
    <div id="evoKpis"></div>
    <div id="evoCharts"></div>
  `;
  $('#evoYearSelect').onchange = e => { ui.evoYear=e.target.value; renderEvoContent(); };
  $('#evoMonthSelect').onchange = e => { ui.evoMonth=e.target.value; renderEvoContent(); };
  renderEvoContent();
}
function evoScoped(list){ return list.filter(c=>{ if(c.date.slice(0,4)!==ui.evoYear) return false; if(ui.evoMonth && String(parseInt(c.date.slice(5,7),10))!==String(ui.evoMonth)) return false; return true; }); }
function renderEvoContent(){
  const all = data.cotisations; const paid = all.filter(c=>c.status==='paid');
  const scopedAll = evoScoped(all); const scopedPaid = evoScoped(paid);
  const total = scopedPaid.reduce((s,c)=>s+c.amount,0);
  const pendingAmt = scopedAll.filter(c=>c.status==='pending').reduce((s,c)=>s+c.amount,0);
  const nbCotisants = new Set(scopedPaid.map(c=>c.memberId)).size;
  const moyenne = scopedPaid.length>0 ? total/scopedPaid.length : 0;
  const tauxPaiement = scopedAll.length>0 ? Math.round((scopedPaid.length/scopedAll.length)*100) : 0;
  const kpis = [
    {label:'Collecté', value:euros(total)}, {label:'En attente', value:euros(pendingAmt)},
    {label:'Cotisants', value:nbCotisants}, {label:'Cotisations', value:scopedPaid.length},
    {label:'Moyenne / versement', value:euros(moyenne)}, {label:'Taux de paiement', value:tauxPaiement+'%'}
  ];
  $('#evoKpis').innerHTML = `<div class="summary" style="margin-bottom:4px;">${kpis.map(k=>`<div class="card"><div class="label">${escapeHTML(k.label)}</div><div class="value" style="font-size:16px;">${k.value}</div></div>`).join('')}</div>`;

  const yearCotis = evoScoped(paid);
  const listsWithData = data.lists.filter(l=>yearCotis.some(c=>c.listId===l.id));
  const series = listsWithData.map((l,i)=>{ const monthly=new Array(12).fill(0); yearCotis.filter(c=>c.listId===l.id).forEach(c=>{ monthly[parseInt(c.date.slice(5,7),10)-1]+=c.amount; }); return {name:l.name, color:colorForIndex(i), values:monthly}; });
  const listTotals = data.lists.map((l,i)=>({name:l.name, color:colorForIndex(i), total:yearCotis.filter(c=>c.listId===l.id).reduce((s,c)=>s+c.amount,0)})).filter(x=>x.total>0).sort((a,b)=>b.total-a.total);

  $('#evoCharts').innerHTML = `
    <div class="chart-card"><h3>Évolution mensuelle par liste</h3><div class="chart-sub">Montant payé par mois, barres compilées — ${ui.evoYear}</div>
      ${series.length>0?svgStackedBarChart(MONTHS_SHORT, series):'<div class="chart-empty">Aucune cotisation payée sur cette période.</div>'}
      ${series.length>0?`<div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;">${series.map(s=>`<span style="display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-soft);"><span style="width:10px;height:10px;border-radius:3px;background:${s.color};display:inline-block;"></span>${escapeHTML(s.name)}</span>`).join('')}</div>`:''}

function truncateLabel(s){ return s.length>14 ? s.slice(0,13)+'…' : s; }
function svgStackedBarChart(labels, series){
  const w=480,h=250,padL=32,padR=10,padT=22,padB=28; const innerW=w-padL-padR, innerH=h-padT-padB;
  const totalsPerMonth = labels.map((_,i)=>series.reduce((s,se)=>s+(se.values[i]||0),0));
  const maxVal = Math.max(1, ...totalsPerMonth); const gap=innerW/labels.length; const barW=Math.min(30, gap*0.6);
  let svg='';
  for(let g=0; g<=4; g++){ const gy=padT+innerH-(g/4)*innerH; svg+=`<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${w-padR}" y2="${gy.toFixed(1)}" style="stroke:var(--paper-line);stroke-width:1;"></line><text x="${padL-4}" y="${(gy+3).toFixed(1)}" font-size="8" text-anchor="end" style="fill:var(--ink-faint);font-family:'IBM Plex Mono',monospace;">${Math.round(maxVal*g/4)}</text>`; }
  labels.forEach((lab,i)=>{
    const x=padL+i*gap+(gap-barW)/2; let yCursor=padT+innerH;
    series.forEach(s=>{
      const v=s.values[i]||0; if(v<=0) return;
      const segH=(v/maxVal)*innerH; const y=yCursor-segH;
      svg+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(segH,0.5).toFixed(1)}" style="fill:${s.color};"></rect>`;
      if(segH>13){ svg+=`<text x="${(x+barW/2).toFixed(1)}" y="${(y+segH/2+3).toFixed(1)}" font-size="7" text-anchor="middle" style="fill:#fff;font-family:'IBM Plex Mono',monospace;font-weight:600;">${Math.round(v)}</text>`; }
      yCursor=y;
    });
    if(totalsPerMonth[i]>0){ svg+=`<text x="${(x+barW/2).toFixed(1)}" y="${(yCursor-4).toFixed(1)}" font-size="8" text-anchor="middle" style="fill:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-weight:600;">${Math.round(totalsPerMonth[i])}</text>`; }
    svg += `<text x="${(x+barW/2).toFixed(1)}" y="${h-padB+13}" font-size="8" text-anchor="middle" style="fill:var(--ink-faint);font-family:'IBM Plex Mono',monospace;">${lab}</text>`;
  });
  svg += `<line x1="${padL}" y1="${padT+innerH}" x2="${w-padR}" y2="${padT+innerH}" style="stroke:var(--paper-line);stroke-width:1;"></line>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;">${svg}</svg>`;
}
function svgRingChart(items){
  const size=220, cx=size/2, cy=size/2, rOuter=95, rInner=55;
  const total = items.reduce((s,x)=>s+x.total,0) || 1;
  let angle=-90; let paths='';
  items.forEach(it=>{
    const frac = it.total/total; const sweep = frac*360;
    const a0=angle*Math.PI/180, a1=(angle+sweep)*Math.PI/180;
    const x0o=cx+rOuter*Math.cos(a0), y0o=cy+rOuter*Math.sin(a0);
    const x1o=cx+rOuter*Math.cos(a1), y1o=cy+rOuter*Math.sin(a1);
    const x0i=cx+rInner*Math.cos(a1), y0i=cy+rInner*Math.sin(a1);
    const x1i=cx+rInner*Math.cos(a0), y1i=cy+rInner*Math.sin(a0);
    const large = sweep>180?1:0;
    paths += `<path d="M${x0o.toFixed(1)},${y0o.toFixed(1)} A${rOuter},${rOuter} 0 ${large} 1 ${x1o.toFixed(1)},${y1o.toFixed(1)} L${x0i.toFixed(1)},${y0i.toFixed(1)} A${rInner},${rInner} 0 ${large} 0 ${x1i.toFixed(1)},${y1i.toFixed(1)} Z" style="fill:${it.color};"></path>`;
    if(frac>0.05){
      const midA = (angle+sweep/2)*Math.PI/180; const rMid=(rOuter+rInner)/2;
      const lx=cx+rMid*Math.cos(midA), ly=cy+rMid*Math.sin(midA);
      paths += `<text x="${lx.toFixed(1)}" y="${(ly+3).toFixed(1)}" font-size="10" text-anchor="middle" style="fill:#fff;font-family:'IBM Plex Mono',monospace;font-weight:700;">${Math.round(it.total)}</text>`;
    }
    angle += sweep;
  });
  return `<svg viewBox="0 0 ${size} ${size}" style="width:190px;height:190px;display:block;margin:0 auto;">${paths}</svg>`;
}

    <h2 class="section-title">Mon Profil</h2>
    <div class="field" style="text-align:center;"><label>Photo de profil</label>
      <div id="p_photo_preview" style="display:flex;justify-content:center;margin-bottom:10px;">${me.photo?`<img src="${me.photo}" style="width:180px;height:180px;border-radius:50%;object-fit:cover;box-shadow:var(--shadow);border:4px solid var(--paper-light);outline:2px solid var(--gold-soft);">`:`<div style="width:180px;height:180px;border-radius:50%;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:52px;border:4px solid var(--paper-light);outline:2px dashed var(--gold-soft);">${initials(me.prenom+' '+me.nom)}</div>`}</div>
      <input type="file" id="p_photo" accept="image/*" style="max-width:260px;margin:0 auto;display:block;">
      ${me.photo?`<button type="button" id="p_photo_remove" class="del-btn" style="margin-top:6px;">Retirer la photo</button>`:''}
    </div>
    <div class="field"><label>Prénom</label><input type="text" id="p_prenom" value="${escapeHTML(me.prenom)}" autocorrect="on" autocapitalize="sentences" spellcheck="true"></div>
    <div class="field"><label>Nom</label><input type="text" id="p_nom" value="${escapeHTML(me.nom)}" autocorrect="on" autocapitalize="sentences" spellcheck="true"></div>
    <div class="field"><label>Poste</label><select id="p_poste"><option value="">Non précisé</option>${['Gardien','Défenseur','Milieu','Attaquant','Staff / Encadrement'].map(p=>`<option ${me.poste===p?'selected':''}>${p}</option>`).join('')}</select></div>
    ${isSuperAdmin(me) ? `<div class="field"><label>Mon rôle</label><div class="toggle-group"><button type="button" id="p_role_member" class="${selfRole!=='admin'?'active':''}">Membre</button><button type="button" id="p_role_admin" class="${selfRole==='admin'?'active':''}">Admin</button></div><small class="hint">En tant que super-admin, vous seul pouvez ajuster votre propre rôle ici.</small></div>` : ''}
    <div class="field"><label>Mot de passe (code personnel)</label>${passwordFieldHTML('p_code', me.code, '')}</div>
    <button class="dashed-btn" id="saveProfilBtn">Enregistrer les modifications</button>`;
  wirePasswordToggles();
  if($('#p_photo_remove')){ $('#p_photo_remove').onclick=()=>{ me.photo=null; saveData(); render(); showToast('Photo retirée.'); }; }
  $('#p_photo').onchange=(e)=>{ const file=e.target.files&&e.target.files[0]; if(!file) return; const reader=new FileReader(); reader.onload=(ev)=>{ $('#p_photo_preview').innerHTML=`<img src="${ev.target.result}" style="width:180px;height:180px;border-radius:50%;object-fit:cover;box-shadow:var(--shadow);border:4px solid var(--paper-light);outline:2px solid var(--gold-soft);">`; }; reader.readAsDataURL(file); };
  if(isSuperAdmin(me)){
    $('#p_role_member').onclick = () => { selfRole='member'; $('#p_role_member').classList.add('active'); $('#p_role_admin').classList.remove('active'); };
    $('#p_role_admin').onclick = () => { selfRole='admin'; $('#p_role_admin').classList.add('active'); $('#p_role_member').classList.remove('active'); };
  }
  $('#saveProfilBtn').onclick=async()=>{
    const prenom=$('#p_prenom').value.trim(), nom=$('#p_nom').value.trim(), code=$('#p_code').value.trim();
    if(!prenom||!nom){ showToast('Indiquez votre nom et prénom.'); return; } if(!code){ showToast('Choisissez un mot de passe.'); return; }
    if(data.members.some(x=>x.code===code && x.id!==me.id)){ showToast('Ce mot de passe est déjà utilisé.'); return; }
    const pi=$('#p_photo'); if(pi.files&&pi.files.length>0){ try{ me.photo=await compressImage(pi.files[0],500,0.8); }catch(err){ console.error(err); } }
    me.prenom=prenom; me.nom=nom; me.code=code; me.poste=$('#p_poste').value;
    if(isSuperAdmin(me)){ me.role = selfRole; }
    saveData(); render(); $('#userline').textContent=`Connecté(e) : ${me.prenom} ${me.nom}${isAdmin(me)?' · bureau':(isCaptain(me)?' · capitaine':'')}`; showToast('Profil mis à jour.');
  };
}

/* ================= AUTORISATIONS ================= */
function renderAutorisations(){
  const el = $('#autorisationsInner'); const me = currentMember(); updateAutorisationsBadge(me);
  if(!me || !(isSuperAdmin(me) || isPresident(me))){ el.innerHTML = emptyState('','Réservé au président et au super-admin',''); return; }
  const superAdmin = isSuperAdmin(me);
  const allPending = data.members.filter(m=>m.status==='pending');
  const pending = superAdmin ? allPending : allPending.filter(m=>m.desiredRole!=='admin');
  el.innerHTML = `<h2 class="section-title">Demandes d’inscription</h2>${!superAdmin?`<p class="muted" style="margin-bottom:14px;">En tant que président, vous ne voyez que les demandes de rôle Membre. Les demandes Admin passent uniquement par le super-admin.</p>`:''}<div id="pendingZone"></div><div id="membersHistoryZone"></div>`;
  const pz = $('#pendingZone');
  if(pending.length===0){ pz.innerHTML = emptyState('','Aucune demande en attente',''); }
  else { pz.innerHTML = pending.map(m=>`
    <div class="event-card">
      <div class="event-name">${escapeHTML(m.prenom+' '+m.nom)}</div>
      <div class="event-date" style="margin-bottom:10px;">${m.poste?escapeHTML(m.poste):'Poste non précisé'} · rôle souhaité : ${m.desiredRole==='admin'?'Admin':'Membre'}</div>
      ${superAdmin ? `<div class="field"><label>Valider avec le rôle</label>
        <div class="toggle-group">
          <button type="button" data-role-choice="member" data-for="${m.id}" class="role-choice-${m.id} ${m.desiredRole!=='admin'?'active':''}">Membre</button>
          <button type="button" data-role-choice="admin" data-for="${m.id}" class="role-choice-${m.id} ${m.desiredRole==='admin'?'active':''}">Admin</button>
        </div>
      </div>` : ''}
      <div class="sheet-actions"><button class="btn-secondary" data-refuse="${m.id}">Refuser</button><button class="btn-primary" data-accept="${m.id}">Valider${superAdmin?'':' comme membre'}</button></div>
    </div>`).join(''); }
  const chosenRole = {};
  pending.forEach(m=>{ chosenRole[m.id] = (superAdmin && m.desiredRole==='admin') ? 'admin' : 'member'; });
  pz.querySelectorAll('[data-role-choice]').forEach(b=>{
    b.onclick = () => {
      const mid = b.dataset.for; chosenRole[mid] = b.dataset.roleChoice;
      pz.querySelectorAll('.role-choice-'+mid).forEach(x=>x.classList.toggle('active', x===b));
    };
  });
  pz.querySelectorAll('[data-accept]').forEach(b=>{
    b.onclick = () => {
      const m=data.members.find(x=>x.id===b.dataset.accept);
      const role = superAdmin ? (chosenRole[m.id] || 'member') : 'member';
      m.status='active'; m.role = role; delete m.desiredRole;
      data.suggestions.push({id:uid(),senderId:me.id,senderName:`${me.prenom} ${me.nom}`,recipientId:m.id,recipientName:`${m.prenom} ${m.nom}`,text:`Votre inscription au club a été validée avec le rôle : ${role==='admin'?'Admin':'Membre'}. Bienvenue !`,date:new Date().toISOString(),lu:false});
      saveData(); render(); showToast(`${m.prenom} accepté(e) comme ${role==='admin'?'admin':'membre'}.`);
    };
  });
  pz.querySelectorAll('[data-refuse]').forEach(b=>{ b.onclick=()=>{ if(confirm('Refuser et supprimer cette demande ?')){ data.members=data.members.filter(x=>x.id!==b.dataset.refuse); saveData(); render(); } }; });
  renderMembersHistory();
}
function renderMembersHistory(){
  const zone = $('#membersHistoryZone');
  const processed = data.members.filter(m=>m.status==='active').sort((a,b)=>(a.prenom+a.nom).localeCompare(b.prenom+b.nom));
  let html = `<h2 class="section-title" style="margin-top:22px;">Historique des membres</h2>`;
  if(processed.length===0){ html += emptyState('','Aucun membre traité pour l’instant',''); zone.innerHTML=html; return; }
  html += `<div class="filter-bar"><select id="historyMemberSelect"><option value="" disabled selected>Choisir un membre…</option>${processed.map(m=>`<option value="${m.id}">${escapeHTML(m.prenom+' '+m.nom)}</option>`).join('')}</select></div><div id="historyMemberDetail"></div>`;
  zone.innerHTML = html;
  $('#historyMemberSelect').onchange = e => {
    const m = data.members.find(x=>x.id===e.target.value); if(!m) return;
    $('#historyMemberDetail').innerHTML = `<div class="member-card"><div class="who">${m.photo?`<img src="${m.photo}">`:initials(m.prenom+' '+m.nom)}</div><div class="info"><div class="name">${escapeHTML(m.prenom+' '+m.nom)}</div><div class="total">${m.poste?escapeHTML(m.poste):'Poste non précisé'}${isAdmin(m)?' · Bureau':''}${isCaptain(m)?' · Capitaine':''}</div></div></div>`;
  };
}
function updateAutorisationsBadge(me){
  const badge=$('#autorisationsBadge'); if(!badge) return;
  if(!me || !(isSuperAdmin(me) || isPresident(me))){ badge.style.display='none'; return; }
  const relevant = isSuperAdmin(me) ? data.members.filter(m=>m.status==='pending') : data.members.filter(m=>m.status==='pending' && m.desiredRole!=='admin');
  const count = relevant.length;
  if(count>0){ badge.textContent=count; badge.style.display='inline-block'; } else { badge.style.display='none'; }
}

/* ================= SHEET HELPERS ================= */
function openSheet(){ $('#overlay').classList.add('active'); }
function closeSheet(){ $('#overlay').classList.remove('active'); }
$('#overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeSheet(); });

loadData();
</script>
</body>
</html>
